services:
  reelready:
    image: ghcr.io/muzi-xiaoren/reelready:latest
    # Without a published image yet, `docker compose up -d --build` builds from source.
    build: .
    container_name: reelready
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      # Lets the container reach qBittorrent / a proxy running on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
